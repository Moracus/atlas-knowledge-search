services:
  api:
    build: .
    container_name: atlas-fastapi
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app                # 👈 mount project into container
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:atlas_dev_password@postgres:5432/atlas
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    container_name: atlas-worker
    command: arq app.workers.worker.WorkerSettings
    volumes:
      - .:/app                # 👈 same mount for worker
    environment:
      DATABASE_URL: postgresql+psycopg://atlas:atlas_dev_password@postgres:5432/atlas
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis

  redis:
    image: redis:7
    container_name: atlas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_ARGS: --requirepass atlas_yes --appendonly yes

  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis-data: